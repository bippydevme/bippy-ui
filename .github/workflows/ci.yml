name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test @bippy-ui/pdf-flipper
        run: pnpm --filter @bippy-ui/pdf-flipper test

      - name: Build @bippy-ui/pdf-flipper
        run: pnpm --filter @bippy-ui/pdf-flipper build

      - name: Build Next demo (GitHub Pages export)
        run: pnpm --filter next-app build
        env:
          GITHUB_PAGES: "true"
